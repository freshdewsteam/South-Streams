name: Update Cache

on:
  schedule:
    # 00:01, 05:01, 10:01, 15:01, 18:01 UTC
    # 18:01 UTC = deep sweep just before midnight IST (matches scraper.js deep-sweep window)
    - cron: "1 0,5,10,15,18 * * *"
  workflow_dispatch:   # allows manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # NOTE: no npm install step — this project has zero dependencies
      # (scraper.js / server.js use only Node built-ins: https, zlib, fs, path)

      - name: Build catalog cache
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MON_API_KEY: ${{ secrets.MON_API_KEY }}
        run: npm run build

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "chore: refresh OTT catalog cache [skip ci]"
            git push
          fi
